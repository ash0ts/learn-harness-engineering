<svg xmlns="http://www.w3.org/2000/svg" width="680" height="715" viewBox="0 0 680 715" role="img" aria-labelledby="title desc">
<title id="title">A grade follows the exported patch</title><desc id="desc">The same frozen starter is staged for each treatment. Pi edits an actor sandbox, exports its patch, and stops. A fresh grader applies that patch and runs services plus Electron. The result links back to the exact patch and source.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#62665e"/></marker></defs>
<rect width="680" height="715" rx="8" fill="#faf9f6"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#242722}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:16px}.note{font-size:15px;fill:#62665e}</style>
<text class="title" x="28" y="40">A grade follows the exported patch</text>
<rect x="28" y="65" width="624" height="100" rx="6" fill="#ffffff" stroke="#d6d6ce"/><text class="head" x="46" y="95">1  Freeze the inputs</text><text class="body" x="46" y="122">Starter code + selected guidance + task + model settings</text><path d="M340 165 L340 190" stroke="#62665e" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="200" width="624" height="100" rx="6" fill="#ffffff" stroke="#d6d6ce"/><text class="head" x="46" y="230">2  Pi edits in an actor sandbox</text><text class="body" x="46" y="257">Model and tool conversations → candidate.diff</text><path d="M340 300 L340 325" stroke="#62665e" stroke-width="2" marker-end="url(#arrow)"/><text class="note" x="355" y="317.5">collect evidence; terminate actor</text><rect x="28" y="335" width="624" height="100" rx="6" fill="#ffffff" stroke="#d6d6ce"/><text class="head" x="46" y="365">3  A fresh grader applies the patch</text><text class="body" x="46" y="392">Same baseline; protected checker is outside the actor</text><path d="M340 435 L340 460" stroke="#62665e" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="470" width="624" height="100" rx="6" fill="#ffffff" stroke="#d6d6ce"/><text class="head" x="46" y="500">4  Execute services and the Electron window</text><text class="body" x="46" y="527">Import · chunks · retrieval · Q&amp;A · Xvfb/UI assertions</text><path d="M340 570 L340 595" stroke="#62665e" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="605" width="624" height="85" rx="6" fill="#e7f0eb" stroke="#d6d6ce"/><text class="head" x="46" y="635">5  Record the observed outcome</text><text class="body" x="46" y="662">Grade + patch checksum + source + run + trace IDs</text></svg>
