<svg xmlns="http://www.w3.org/2000/svg" width="680" height="755" viewBox="0 0 680 755" role="img" aria-labelledby="title desc">
<title id="title">Three Pi candidates; one approval pause</title><desc id="desc">In the explicit-contract graph run, attempt one fails the architecture guard and rolls back. Attempt two fails compilation and rolls back. Attempt three passes the protected grade and independent service and Electron lanes, then pauses for human approval. A separate manual candidate was approved later.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#62665e"/></marker></defs>
<rect width="680" height="755" rx="8" fill="#faf9f6"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#242722}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:16px}.note{font-size:15px;fill:#62665e}</style>
<text class="title" x="28" y="40">Three Pi candidates; one approval pause</text>
<rect x="28" y="65" width="624" height="112" rx="6" fill="#f5e5df" stroke="#d6d6ce"/><text class="head" x="46" y="95">Attempt 1 · 3e5cd770</text><text class="body" x="46" y="122">Guard accepts a prohibited Node import.</text><text class="body" x="46" y="144">Protected grade fails; the graph rolls back.</text><path d="M340 177 L340 207" stroke="#62665e" stroke-width="2" marker-end="url(#arrow)"/><text class="note" x="355" y="197.0">restore starting point</text><rect x="28" y="217" width="624" height="112" rx="6" fill="#f5e5df" stroke="#d6d6ce"/><text class="head" x="46" y="247">Attempt 2 · 43ad509b</text><text class="body" x="46" y="274">TypeScript compilation fails.</text><text class="body" x="46" y="296">The graph records the failure and rolls back.</text><path d="M340 329 L340 359" stroke="#62665e" stroke-width="2" marker-end="url(#arrow)"/><text class="note" x="355" y="349.0">restore starting point</text><rect x="28" y="369" width="624" height="112" rx="6" fill="#e7f0eb" stroke="#d6d6ce"/><text class="head" x="46" y="399">Attempt 3 · 03ca01ca</text><text class="body" x="46" y="426">Protected grade passes.</text><text class="body" x="46" y="448">Independent services + Electron lanes also pass.</text><path d="M340 481 L340 511" stroke="#62665e" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="521" width="624" height="112" rx="6" fill="#f5eddc" stroke="#d6d6ce"/><text class="head" x="46" y="551">STOP · explicit human decision required</text><text class="body" x="46" y="578">Pi candidate c74cf9cf3716… remains at approval.</text><text class="body" x="46" y="600">Passing tests do not approve or merge the patch.</text><text class="note" x="28" y="680">Separate manual candidate 91c4a2df7b9a… was approved later.</text><text class="note" x="28" y="710">That decision changed only its own qualification checkpoint.</text></svg>
